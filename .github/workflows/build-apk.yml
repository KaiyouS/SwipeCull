name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Fetch whisper.cpp (speech recognition engine)
        run: git clone --depth 1 --branch v1.7.5 https://github.com/ggml-org/whisper.cpp app/src/main/cpp/whisper.cpp
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: SwipeCull-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish release with APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SwipeCull.apk
          gh release create "v1.0-build${{ github.run_number }}" SwipeCull.apk \
            --title "SwipeCull build ${{ github.run_number }}" \
            --notes "Debug APK. Download SwipeCull.apk on your phone and open it to install."
